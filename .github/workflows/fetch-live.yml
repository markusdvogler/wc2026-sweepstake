name: Fetch Live WC Data

# Runs every 15 min during the match window only: 18:00–05:45 UTC
# = 20:00–07:45 CEST (CEST = UTC+2). Plus :00 of 06:00 UTC = 08:00 CEST.
# Also runnable manually from the Actions tab.
on:
  schedule:
    - cron: '*/15 18-23 * * *'   # 18:00–23:45 UTC = 20:00–01:45 CEST
    - cron: '*/15 0-5 * * *'     # 00:00–05:45 UTC = 02:00–07:45 CEST
    - cron: '0 6 * * *'          # 06:00 UTC      = 08:00 CEST (boundary)
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Fetch live scores + stats from RapidAPI
        env:
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
        run: python scripts/fetch-rapidapi.py

      - name: Commit and push if data changed
        run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          git add data/matches.json data/team-stats.json
          git diff --staged --quiet || (git commit -m "Update live data [skip ci]" && git push)
