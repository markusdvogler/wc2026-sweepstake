name: Fetch Match Stats

on:
  schedule:
    - cron: '0 * * * *'   # every hour
  workflow_dispatch:        # manual trigger

jobs:
  stats:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Fetch match stats (fouls, cards, own goals, late goals)
        env:
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
        run: python scripts/fetch-stats.py

      - name: Commit and push if data changed
        run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          git add data/team-stats.json
          git diff --staged --quiet || (git commit -m "Update match stats [skip ci]" && git push)
