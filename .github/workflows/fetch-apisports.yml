name: Fetch WC Data (api-sports)

# Every 5 minutes always-on. The Python script checks the time-of-day
# match window (18:00-08:00 CEST) and exits cleanly outside that window
# without making any API calls. Single simple cron is more reliable than
# hour-ranged ones (GitHub silently drops complex schedules sometimes).
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      backfill:
        description: 'Re-process ALL WC matches (set 1 to backfill)'
        required: false
        default: '0'

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Fetch live scores + stats from api-sports
        env:
          APISPORTS_KEY: ${{ secrets.APISPORTS_KEY }}
          BACKFILL_ALL: ${{ github.event.inputs.backfill }}
        run: python scripts/fetch-apisports.py

      - name: Commit and push if data changed
        run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          git add data/matches.json data/team-stats.json
          git diff --staged --quiet || (git commit -m "Update WC data [skip ci]" && git push)
