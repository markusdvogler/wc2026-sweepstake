name: Fetch WC Data (api-sports)

# Every 15 min during match window: 18:00-05:45 UTC = 20:00-07:45 CEST
# Plus the 06:00 UTC = 08:00 CEST boundary tick.
on:
  schedule:
    - cron: '*/15 18-23 * * *'
    - cron: '*/15 0-5 * * *'
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Fetch live scores + stats from api-sports
        env:
          APISPORTS_KEY: ${{ secrets.APISPORTS_KEY }}
        run: python scripts/fetch-apisports.py

      - name: Commit and push if data changed
        run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          git add data/matches.json data/team-stats.json
          git diff --staged --quiet || (git commit -m "Update WC data [skip ci]" && git push)
