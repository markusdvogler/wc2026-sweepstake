name: Fetch WC Data (api-sports)

# Every 5 minutes always-on. The Python script checks the time-of-day
# match window (18:00-08:00 CEST) and exits cleanly outside that window
# without making any API calls. Single simple cron is more reliable than
# hour-ranged ones (GitHub silently drops complex schedules sometimes).
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

# Serialise runs of this workflow so backfill + cron never race each other.
concurrency:
  group: fetch-apisports
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Fetch live scores + stats from api-sports
        env:
          APISPORTS_KEY: ${{ secrets.APISPORTS_KEY }}
        run: python scripts/fetch-apisports.py

      - name: Commit and push if data changed
        run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          git add data/matches.json data/team-stats.json data/standings.json
          if git diff --staged --quiet; then
            echo "No changes."
            exit 0
          fi
          git commit -m "Update WC data [skip ci]"
          # Retry-on-conflict: if external push lands between our checkout
          # and push, rebase onto it and try again. Up to 5 attempts.
          for i in 1 2 3 4 5; do
            if git push; then
              echo "Pushed on attempt $i"
              exit 0
            fi
            echo "Push attempt $i failed, rebasing..."
            git pull --rebase origin main || exit 1
          done
          echo "Push failed after 5 attempts."
          exit 1
